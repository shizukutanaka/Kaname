# about.toml — cargo-about 設定
#
# 第三者ライセンス開示の自動生成。SOC2 監査で要求される SBOM の一部。
#
# 実行: cargo about generate -c about.toml --output-file LICENSE-THIRD-PARTY.md
#
# CI: .github/workflows/ci.yml で自動実行され、リリースアーティファクトに含める

# ライセンスを取得するクレート
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "Unlicense",
]

# プライベート/ワークスペース内クレートを除外
ignore-build-dependencies   = true
ignore-dev-dependencies     = true
ignore-transitive-dependencies = false

# ワークスペース内のクレートはスキップ (自身のコード)
[workarounds]
ring = ["ring"]

# 出力テンプレート
[output]
template = """
# Third-Party Licenses

This file lists all third-party software included in Kaname binary distributions.
Generated automatically by `cargo-about`. Do not edit manually.

Last updated: {{datestamp}}
Total dependencies: {{licenses_count}}

---

{{#each licenses}}
## {{name}}

Used by:
{{#each used_by}}  - {{crate.name}} {{crate.version}}
{{/each}}

License: {{name}}

```
{{text}}
```

---

{{/each}}
"""
