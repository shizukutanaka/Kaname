# about.toml — cargo-about 設定
#
# 第三者ライセンス開示の自動生成。SOC2 監査で要求される SBOM の一部。
#
# 実行: cargo about generate -c about.toml about.hbs --output-file LICENSE-THIRD-PARTY.md
#
# CI: .github/workflows/sbom.yml で自動実行され、リリースアーティファクトに含める

# ライセンスを取得するクレート
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "Unlicense",
    # webpki-roots (Mozilla のルート証明書ストア) のライセンス
    "CDLA-Permissive-2.0",
]

# ビルド時/開発時のみの依存を除外
ignore-build-dependencies   = true
ignore-dev-dependencies     = true
ignore-transitive-dependencies = false

# ワークスペース内のクレートはスキップ (自身のコード。
# 各クレートは publish = false のため private として扱われる)
private = { ignore = true }

# 現行の cargo-about (0.9 系) では workarounds は組み込み回避策の
# 名前を並べる配列で指定する
workarounds = ["ring"]

# 出力テンプレートは about.hbs (現行の cargo-about では設定ファイルに
# テンプレートを埋め込めず、生成コマンドの引数で .hbs ファイルを渡す)
