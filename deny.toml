# deny.toml — cargo deny 設定
# CI で `cargo deny check all` を実行して全チェックを通過することが必須

# ─────────────────────────────────────────────────────────────────────────────
# グラフチェック: 重複依存の検出
# ─────────────────────────────────────────────────────────────────────────────
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

# ─────────────────────────────────────────────────────────────────────────────
# ライセンスチェック
# AGPL-3.0 と互換するライセンスのみ許可
# ─────────────────────────────────────────────────────────────────────────────
[licenses]
version          = 2
allow            = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",      # ソース開示義務あり — レビュー済み
    "AGPL-3.0-or-later", # ワークスペース自クレートの宣言ライセンス
    "Zlib",        # foldhash (tauri-utils 経由) — OSI/FSF 承認済み
    "Unicode-3.0", # icu_* (idna/url 経由) — OSI 承認済み
    "CDLA-Permissive-2.0", # webpki-roots (reqwest 経由の Mozilla ルート証明書) — permissive
]
# cargo-deny 0.18+ (PR611): deny/copyleft/allow-osi-fsf-free/default は廃止。
# allow リストに無いライセンスは暗黙に deny される。
# 旧 deny 対象: GPL-2.0 / BUSL-1.1 / SSPL-1.0 / Commons-Clause — いずれも allow 非含有で拒否継続。

# ─────────────────────────────────────────────────────────────────────────────
# 禁止クレート: セキュリティリスク・廃止・代替あり
# ─────────────────────────────────────────────────────────────────────────────
[bans]
multiple-versions      = "warn" # 重複バージョンは警告
wildcards              = "deny"  # ワイルドカードバージョン禁止 (registry のみ)
allow-wildcard-paths   = true    # ワークスペース内 path 依存 (version 省略 = "*") は許可
highlight         = "all"
# build.rs 経由のサプライチェーン攻撃リスク低減:
# ビルドスクリプトを持つクレートの追加は明示的な承認が必要
# (cargo-deny v0.15+ の build-scripts フィールド)

# 明示的に禁止するクレート
# 出典: zenn.dev/kotabrog/articles/4d971167af4664 (cargo-deny ベストプラクティス 2025)
deny = [
    # 既知の脆弱性がある暗号実装
    { name = "rust-crypto", reason = "廃止済み。ring または RustCrypto に移行" },
    # 非同期ランタイム混在を防ぐ
    { name = "async-std", reason = "tokio との混在禁止。tokio 統一" },
    # 安全でない JSON パーサー
    { name = "json", reason = "serde_json を使用" },
    # ロギング競合
    { name = "env_logger", reason = "tracing-subscriber を使用" },
    # Windows API 直接呼び出し禁止 (Tauri が管理)
    { name = "winapi", version = "< 0.3", reason = "古いバージョン。windows-sys を使用" },
    # typosquatting 対策: よく混同される名前
    { name = "serde-json", reason = "typosquat 警戒: 正しくは serde_json (アンダースコア)" },
    { name = "tokio-core", reason = "廃止済み。tokio 1.x を使用" },
    { name = "openssl", reason = "rustls を使用 (FIPS 非互換版)" },
    # 情報漏洩リスクのある直接ネットワーク access を P-LLM 相当クレートに禁止
    { name = "attohttpc", reason = "reqwest (rustls-tls) を使用" },
    { name = "ureq", reason = "reqwest (rustls-tls) を使用" },
    # ReDoS リスク: fancy-regex は指数的バックトラッキングを持つ
    { name = "fancy-regex", reason = "ReDoS 脆弱性あり。regex (NFA/DFA) を使用" },
    # 廃止済み JWT クレート
    { name = "jsonwebtoken", reason = "内部 JWT はなし。外部認証は reqwest + oauth2 で実装" },
    # サプライチェーン攻撃クレート (2025-2026 に悪意ある build.rs が発覚)
    { name = "onering", reason = "build.rs がソースコードを外部送信 (2026/06 発覚)" },
    { name = "faster_log", reason = "秘密鍵を外部送信するマルウェア (2025/05 発覚)" },
    { name = "async_println", reason = "秘密鍵を外部送信するマルウェア (2025/05 発覚)" },
]

# 許可する重複バージョン (推移的依存による不可避なケース)
skip = [
    # syn は複数バージョンが共存することがある (proc-macro)
    { name = "syn" },
    # rand はいくつかの crate が異なるメジャーバージョンを依存
    { name = "rand" },
]

# ─────────────────────────────────────────────────────────────────────────────
# 脆弱性チェック (RustSec Advisory DB)
# ─────────────────────────────────────────────────────────────────────────────
[advisories]
version          = 2
db-path          = "~/.cargo/advisory-db"
db-urls          = ["https://github.com/rustsec/advisory-db"]
# vulnerability/notice は 0.18+ で廃止 (脆弱性は常にエラー)
unmaintained     = "workspace" # メンテナンス停止は警告
unsound          = "all"       # 健全性問題がある場合はビルド失敗
yanked           = "deny"      # yank されたバージョン禁止

# 承認済みの例外 (理由と期限を必ず記録)
ignore = [
    # RUSTSEC-2024-0429: glib 0.18.5 VariantStrIter unsoundness
    # 影響: Iterator impl が NULL ポインタ経由で UB → 理論上クラッシュ
    # 状況: Tauri 2.x の推移的依存 (gtk/webkit2gtk 経由、Linux ビルドのみ有効)。
    #       macOS/Windows ビルドでは gtk 系はリンクされない。VariantStrIter の
    #       呼び出しは Kaname コードから直接到達しない。
    # 期限: Tauri が glib 0.20 系へ更新する次期メジャーで解消。Tauri 更新時に再評価。
    "RUSTSEC-2024-0429",
]

# ─────────────────────────────────────────────────────────────────────────────
# ソースチェック: crates.io 以外のソース管理
# ─────────────────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"    # 未知のレジストリ禁止
unknown-git      = "deny"    # 未知の git ソース禁止
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
