[package]
name             = "kaname-ui"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
publish             = false

[lib]
name = "kaname_ui"

[dependencies]
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
kaname-oobv = { path = "../kaname-oobv" }
kaname-render = { path = "../kaname-render" }
kaname-memory-guard = { path = "../kaname-memory-guard" }
# 看板機能である BEC 検出を出荷バイナリに組み込む。
# kaname-bec の外部依存 (serde/serde_json/thiserror/tokio/tracing) は
# すべて本クレートに既存のため、新規の外部 crate は増えない。
kaname-bec = { path = "../kaname-bec" }
# ローカル LLM (Phi-4-mini) の実行とモデル配布 (D2 Phase 5)。
# llama-cpp-2 → llama-cpp-sys-2 の C++ ビルドが入るため出荷バイナリに
# cmake が必要になる点に注意 (blueprint に導入済み)。
kaname-ai  = { path = "../kaname-ai" }
# 複数メールを横断するキャンペーン検出 (PCR)。フォルダ一括解析で使用する。
kaname-radar = { path = "../kaname-radar" }
# 受信メール内の機微情報検出 (Direction::Inbound)。解析結果に含める。
kaname-dlp = { path = "../kaname-dlp" }
# JMAP サーバとの実接続 (受信・送信)。reqwest はこのクレート経由で入る。
kaname-jmap = { path = "../kaname-jmap" }
# 送信者履歴の永続化 (BEC の履歴シグナルに供給する)。
kaname-store = { path = "../kaname-store" }
# 本文リンクの SaaS 安全性判定 (偽 SaaS ドメイン・OAuth state 検証)。
kaname-saas-guard = { path = "../kaname-saas-guard" }
# MLS E2E 暗号化 (D1 Phase 4): 受信メール内の MLS エンベロープ処理と
# 会話状態の SQLCipher 永続化。rusqlite/sqlcipher は kaname-store 経由で
# 既に依存に含まれる。
kaname-mls = { path = "../kaname-mls" }
# 送信者文体認証 (アカウント乗っ取り検出)。
kaname-ssa = { path = "../kaname-ssa" }
# トラッキングピクセル検出 (README が謳うプライバシー保護の実体)。
kaname-privacy = { path = "../kaname-privacy" }
kaname-observability = { path = "../kaname-observability" }
# 履歴 DB の既定パスと SQLCipher 鍵の生成に使う。
dirs = { workspace = true }
rand = { workspace = true }
# JMAP トークンを Zeroizing で包む (kaname-jmap::ClientConfig.bearer_token)
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }


[lints]
workspace = true
