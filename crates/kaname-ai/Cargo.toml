[package]
name             = "kaname-ai"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
publish             = false

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
dirs       = { workspace = true }
sha2       = { workspace = true }
hmac       = { workspace = true }
rand       = { workspace = true }
kaname-screen = { path = "../kaname-screen" }
tokio         = { workspace = true }
# llama.cpp FFI の safe wrapper。0.1.x は API 破壊的変更が頻繁なため
# 実装検証済みのバージョンにピン留め (D2 Phase 1)。
llama-cpp-2   = "=0.1.156"
encoding_rs   = "0.8"  # llama-cpp-2 の token_to_piece が要求する UTF-8 デコーダ
# Phase 2 (モデル配布): ストリーミング DL に stream feature、イテレートに futures-util
reqwest       = { workspace = true, features = ["stream"] }
futures-util  = "0.3"

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
