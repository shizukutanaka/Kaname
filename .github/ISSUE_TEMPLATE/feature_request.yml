name: ✨ 機能要望
description: 新しい機能を提案する
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: どんな状況でどんな問題があるか
    validations: { required: true }

  - type: textarea
    id: proposed
    attributes:
      label: 提案する解決策
    validations: { required: true }

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - 必須 (blocker)
        - 重要
        - あると便利
        - 思いつき
    validations: { required: true }

  - type: checkboxes
    id: alignment
    attributes:
      label: 北極星との整合性
      description: Kaname の北極星「AIが助けても裏切らない」に整合する機能ですか?
      options:
        - label: はい、Security/Speed/Privacy のいずれかを強化する
          required: true
