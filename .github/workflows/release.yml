# .github/workflows/release.yml
#
# Kaname release pipeline.
#
# Rewritten 2026-11-13 after a pre-release audit. The previous version
# described infrastructure that does not exist in this project (an HSM
# signing service with bespoke CLIs, two-operator hardware-token
# approvals by named third parties, a corporate Apple ID / Azure EV
# certificate, a release CDN) and could never complete — it had never
# been run. This version is deliberately minimal and honest:
#
#   * Triggered manually (workflow_dispatch). Dispatching requires
#     write access to this repository, which is the authorization.
#   * The tag must already exist. Preflight verifies the tag version
#     matches Cargo.toml (workspace), package.json and
#     src-tauri/tauri.conf.json before anything is built.
#   * Builds UNSIGNED Tauri bundles for macOS (arm64 + x86_64),
#     Windows x64 and Linux x64 (glibc), using the same dependency
#     recipe as ci.yml (system packages, Node 22, npm ci, and the
#     Tauri CLI, which runs the frontend build itself).
#   * Publishes a GitHub Release whose notes are the matching
#     CHANGELOG.md section, with all bundles and a SHA256SUMS.txt.
#
# NOT covered yet — add only when the infrastructure actually exists:
# code signing / notarization, manifest signing, SLSA provenance,
# CDN distribution, Windows/Linux ARM64 bundles.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.7.1)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: true
        type: boolean
        default: true

# Least privilege: only the publish job may write.
permissions:
  contents: read

concurrency:
  # One release at a time.
  group: release
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 0. Preflight — the tag must exist and all version files must agree
  # ============================================================================
  preflight:
    name: Preflight checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Verify tag version matches all version files
        id: check
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(awk '/^\[workspace.package\]/{f=1} f && /^version/{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "tag=$TAG cargo=$CARGO_VERSION package.json=$PKG_VERSION tauri.conf.json=$TAURI_VERSION"
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml workspace version ($CARGO_VERSION) does not match tag $TAG"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag $TAG"
            exit 1
          fi
          if [ "$TAURI_VERSION" != "$VERSION" ]; then
            echo "::error::tauri.conf.json version ($TAURI_VERSION) does not match tag $TAG"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # 1. Build unsigned Tauri bundles per platform (recipe mirrors ci.yml)
  # ============================================================================
  build:
    name: Build · ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14,     target: aarch64-apple-darwin }
          - { name: macos-x64,   os: macos-14,     target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-2022, target: x86_64-pc-windows-msvc }
          - { name: linux-x64,   os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BUNDLE_DIR" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -exec cp {} dist-release/ \;
          ls -la dist-release
          if [ -z "$(ls -A dist-release)" ]; then
            echo "::error::No bundle artifacts were produced under $BUNDLE_DIR"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: dist-release/
          retention-days: 7

  # ============================================================================
  # 2. Publish the GitHub Release
  # ============================================================================
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist-release
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (f) exit; if (index($0, "[" ver "]")) f = 1 }
            f { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Kaname ${{ inputs.tag }}" > release-notes.md
          fi
          cat >> release-notes.md <<'EOF'

          ---

          ⚠️ **Unsigned builds.** These artifacts are not code-signed or
          notarized yet. macOS Gatekeeper and Windows SmartScreen will
          warn on first launch.
          EOF
          cat release-notes.md

      - name: Generate checksums
        shell: bash
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Kaname ${{ inputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease }}
          files: dist-release/*
