<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src ipc: http://ipc.localhost tauri://localhost" />
    <title>要 Kaname</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; overflow: hidden; }
      body {
        background: #080C11;
        color: #F5F7FA;
        font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* キーボード操作時にフォーカス位置が分かるよう、フォーカスリングを
         保証する (コンポーネント側で outline:none を使っているため)。 */
      :focus-visible {
        outline: 2px solid #00C4CC;
        outline-offset: 1px;
      }
      /* アクセシビリティ: Reduce Motion 設定のユーザーにはアニメーションを
         実質ゼロにする。 */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
